{{template "research-header" .}}
<div class="page-heading"><h1>总览</h1><p>查看需求、产品与当天进展。</p></div>
<section class="metrics" aria-label="累计数量">
  <article><h2>需求总数</h2><strong data-count="{{.Needs}}">{{.Needs}}</strong><p>全部已记录需求，含历史资料</p></article>
  <article><h2>已完成需求</h2><strong data-count="{{.Completed}}">{{.Completed}}</strong><p>已通过生产核验的需求</p></article>
  <article><h2>产品数量</h2><strong data-count="{{.Products}}">{{.Products}}</strong><p>公开清单中的产品</p></article>
</section>
<section class="panel" aria-label="数据接收状态"><div class="status-row"><div><h3>外部数据接入</h3><p>Codex 完成搜寻与立项判断，网站管理交付结果。</p></div><span class="status">{{if .APIEnabled}}已启用{{else}}未启用{{end}}</span></div></section>
{{template "report-summary" .}}
{{template "research-footer" .}}
