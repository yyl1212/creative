<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>管理员登录 · Creative</title><link rel="stylesheet" href="/admin/static/admin.css"></head><body><main class="login"><a class="brand" href="/admin/login">creative<span>.</span></a><p class="eyebrow">管理工作区</p><h1>欢迎回来。</h1><p class="intro">登录后查看需求与产品的真实状态。</p>{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/admin/login">{{.CSRF}}<label for="username">管理员账号</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="64" autocapitalize="none" spellcheck="false"><label for="password">密码</label><input id="password" type="password" name="password" autocomplete="current-password" required maxlength="128"><button type="submit">登录工作区 <span aria-hidden="true">↗</span></button></form><p class="footnote">账号由私有初始化命令创建。需要恢复访问时，请使用服务器端恢复命令。</p></main></body></html>
