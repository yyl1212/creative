<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>管理员登录 · Creative</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body class="login-page">
  <main class="login">
    <a class="brand" href="/admin/login"><span class="brand-symbol" aria-hidden="true">C</span>Creative</a>
    <div class="login-heading"><h1>登录管理后台</h1><p>查看需求、产品与服务的当前状态。</p></div>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="/admin/login">
      {{.CSRF}}
      <label for="username">管理员账号</label>
      <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="64" autocapitalize="none" spellcheck="false">
      <label for="password">密码</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required maxlength="128">
      <button type="submit">登录</button>
    </form>
    <p class="footnote">账号由服务器端创建。如需恢复访问，请使用私有管理员恢复命令。</p>
  </main>
  <p class="login-footer">Creative · 管理工作区</p>
</body>
</html>
